name: Build en Deploy Cyber Defense Quiz

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BROWSER_PROJECT: "Cyber Defense Game/Cyber_Defense_Game.Browser/Cyber_Defense_Game.Browser.csproj"
  SERVER_PROJECT: "Cyber Defense Game/Cyber_Defense_Game.Server/Cyber_Defense_Game.Server.csproj"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Haal de broncode op
        uses: actions/checkout@v4

      - name: 2. Installeer .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Installeer WebAssembly tools en project-workloads
        run: |
          dotnet workload install wasm-tools wasm-tools-net10
          dotnet workload restore "$BROWSER_PROJECT"

      - name: 4. Voeg SkiaSharp WebAssembly ondersteuning toe en Restore
        run: |
          dotnet add "$BROWSER_PROJECT" package SkiaSharp.NativeAssets.WebAssembly
          dotnet restore "$BROWSER_PROJECT"
          dotnet restore "$SERVER_PROJECT"

      - name: 5. Publiceer de Avalonia Browser applicatie
        run: >
          dotnet publish "$BROWSER_PROJECT"
          -c Release
          -o ./publish-browser
          --no-restore
          -p:WasmBuildNative=true

      - name: 6. Publiceer de C# Server applicatie
        run: >
          dotnet publish "$SERVER_PROJECT"
          -c Release
          -o ./publish-server
          --no-restore

      - name: 7. Sla de gebouwde website op
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-wwwroot
          path: ./publish-browser/wwwroot

      - name: 8. Sla de gebouwde server op
        uses: actions/upload-artifact@v4
        with:
          name: cyber-server
          path: ./publish-server

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: 1. Download de nieuwe website- en serverbestanden
        uses: actions/download-artifact@v4
        with:
          path: /root/game/deploy-temp

      - name: 2. Vervang de websitebestanden
        run: |
          mkdir -p /root/game/wwwroot
          rm -rf /root/game/wwwroot/*
          cp -r /root/game/deploy-temp/avalonia-wwwroot/* /root/game/wwwroot/
          chmod -R 755 /root/game/wwwroot

      - name: 3. Vervang de serverbestanden
        run: |
          mkdir -p /root/game/server
          rm -rf /root/game/server/*
          cp -r /root/game/deploy-temp/cyber-server/* /root/game/server/
          rm -rf /root/game/deploy-temp
          chmod -R 755 /root/game/server

      - name: 4. Start of herstart alle containers op de Pi
        run: docker compose -f /root/game/docker-compose.yml up -d --force-recreate website server
